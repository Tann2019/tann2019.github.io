# Big Sky API: guestbook notes (D1) and live cursors (a Durable Object).
# Setup steps are in README.md. Replace both REPLACE_WITH_* ids before deploying.
name = "bigsky-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# Sites allowed to call the API. Comma separated, exact origins.
ALLOWED_ORIGINS = "https://tannersteorts.com,https://www.tannersteorts.com,http://localhost:4321,http://127.0.0.1:4321"

# Secrets, set with `npx wrangler secret put <NAME>`:
#   ADMIN_TOKEN  Bearer token for hiding and deleting notes
#   IP_SALT      Salt for hashing client IPs before rate limiting
#   BLOCKLIST    Optional extra blocked words, comma separated

[[d1_databases]]
binding = "DB"
database_name = "bigsky"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Rate limit stamps: salted IP hashes that expire after 60 s.
[[kv_namespaces]]
binding = "RATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[durable_objects.bindings]]
name = "CURSORS"
class_name = "CursorRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CursorRoom"]

[observability]
enabled = true
